# ho-proxy (Page 版): sonoke → xnexus gate 入站反代 · Cloudflare Pages 配置
# 与 workers/ho-proxy (Worker 版) 并列并存, 任选其一指向 sonoke, 另一即热备
# 拓扑: sonoke → proxy.360710.xyz (CF Pages) → xnexus-o.hf.space
#
# 🔴 INTERNAL_PSK = gate.js 同源常量值 (PSK)。此值经 `wrangler pages secret put INTERNAL_PSK`
#    或 CF Dashboard → 该项目 → Settings → Variables → Secrets 注入, 不落 git/本 toml。
#    functions/[[path]].js 前置校验 "Bearer $INTERNAL_PSK", 缺省即 fail-closed 拒。
# 🔴 HF_TOKEN = xnexus-o 所属账号的 HF 平台 token (私有 Space 门票)。同样经 Secret 注入, 不落 git。
#    functions/_middleware.js 出站 fetch 自动注入 `X-Api-Key: <HF_TOKEN>`, 与透传的
#    `Authorization: Bearer <PSK>`(gate 应用层) 是两个不同头, 共存互不冲突。
#    未注入 HF_TOKEN 时行为=公开 Space 纯透传 (向后兼容), 不报错。
# 文件名用 _middleware.js 而非 [[path]].js: wrangler 4.128 把 [[path]] 当 glob 吞空 (pages dev
#   "No Functions") → 全站 404; _middleware.js 为根级中间件, 拦截全路径等价 catch-all (实测 503/401 正确)。
#
# 自定义域: CF Dashboard → Pages 项目 → Custom Domains → Add `proxy.360710.xyz`
#   (先 dashboard 关联, 后往 360710.xyz zone 加 CNAME `proxy → <site>.pages.dev`, 否则 522)
name = "ho-proxy-pages"
compatibility_date = "2026-04-26"