name: Sync Space skeleton to prod Space (nomke)

# 三层解耦 · 骨架同步 (PROD: nomke/omn)
# 2026-07-26 六件制新增: 此件 prod 专投 nomke/omn。
#   与 dev 版 sync Space 骨架件同血统 (件名见 DECISIONS "workflow 六件命名规约" 条), 三处差异:
#   1. 目标 Space = nomke/omn (生产)
#   2. token = HF_TOKEN_NOMKE (命名空间隔离)
#   3. 仅 workflow_dispatch 无 push 触发 — 生产骨架首投即触 HF Rebuild,
#      点火权属圣上显令 (非 dev 改动自动推); 防 prod 骨架随 dev 漂移误触 Rebuild。
#
# 高风险: push Space 触 HF 自动 Rebuild。生产 Rebuild 前 R2 可恢复须先证 (DECISIONS:
#   "先证后建" 铁律 — 步2三子读数报回前 Phase 2 六步一律不启), Rebuild = first-init
#   数据清零事件正撞单写铁律, 故无 push 触发 + 圣上显令 + Rebuild 前置 R2 鉴别。
#
# BASE_IMAGE: Space Variable 由圣上手动钉锚 digest 9c9aecf (见 DECISIONS), 非 workflow 注入。
# 触发: 仅 workflow_dispatch (圣上显令, 无 push 触发)。

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Stage skeleton whitelist (4 files)
        run: |
          mkdir -p /tmp/hf-sync
          # 白名单: 仅 HF Space 骨架四件, 零业务件泄漏 (三层解耦后业务件不进 Space git 仓)
          for f in Dockerfile start.sh README.md .gitattributes; do
            cp "$f" /tmp/hf-sync/
          done
          echo "---- files to sync to nomke/omn (PROD) ----"
          ls -la /tmp/hf-sync

      - name: Push to HF Space (prod = nomke/omn)
        env:
          T: ${{ secrets.HF_TOKEN_NOMKE }}
        run: |
          cd /tmp/hf-sync
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          # commit 带 n-omn 源 SHA: Space 侧每次构建可一眼对回 n-omn 血统
          git commit -qm "sync-prod: n-omn@${GITHUB_SHA::7}" || echo "No changes to commit"
          git branch -M main
          git remote add hf "https://oauth2:${T}@huggingface.co/spaces/nomke/omn"
          git push --force hf main
