name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'init-nim-keys.sh'
      - 'litestream.yml'
      - 'gate.js'
      - 'package.json'
      - 'README.md'
      - '.github/workflows/sync-to-hf-space.yml'
  workflow_dispatch:

jobs:
  sync-to-hf-space:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Prepare Hugging Face Space files
        run: |
          mkdir -p /tmp/hf-space-sync
          # 白名单同步：仅复制 HF Space 部署所需文件，避免黑名单遗漏泄漏
          for f in Dockerfile entrypoint.sh init-nim-keys.sh litestream.yml \
                   gate.js package.json README.md; do
            cp "$f" /tmp/hf-space-sync/
          done
          # 审计：列出将同步到 HF 的文件清单
          echo "---- files to sync to HF Space ----"
          ls -la /tmp/hf-space-sync/

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd /tmp/hf-space-sync
          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "sync: update Hugging Face Space from GitHub" || echo "No changes to commit"
          git branch -M main
          git remote add hf https://oauth2:${HF_TOKEN}@huggingface.co/spaces/nomke/omn
          git push --force hf main
