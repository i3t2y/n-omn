name: Sync Space skeleton to dev Space (nonoke)

# 三层解耦 · 骨架同步 (高风险: push Space 触 HF 自动 Rebuild)
#
# 2026-07-26 六件制改名 + 去 matrix: sync-space-skeleton.yml → sync-space-nonoke.yml (dev 专投 nonoke/omn)。
#   原双投 matrix 结构撤 (命名空间隔离铁律: dev 件零生产 Space 引用, prod 件零 dev Space 引用)。
#   prod 版同案独立 (件名见 DECISIONS "workflow 六件命名规约" 条), 仅手动 dispatch (无 push 触发, 点火权属圣上)。
#
# 新拓扑 (2026-07-25 撤销 omn-v2 第三个 Space, 见 DECISIONS):
#   HF 免费层 2026-07 关闭新建 Docker Space 通道, 现役两 Space (本件目标 dev + 旧生产 v4.2.3)
#   是祖父条款保护稀缺资产, 全程不再新建任何 Space。
#   现不蓝绿净室首跑: dev Space 已跑三层真机验 (C2/九段/②), ②六绿即"已验证现役
#   架构", 晋级生产仅变量切换 + Restart, 零 Rebuild 零净室首跑。
#
# 首投前 BASE_IMAGE Variable 由圣上手动钉锚 digest 9c9aecf (见 DECISIONS),
#   跨过整个"浮动 tag Rebuild 错误基座"风险类; T6 base-image.yml 建后此锚自动化。
#
# Token: HF_TOKEN_NONOKE — 写 nonoke/omn (dev) + nonoke/omn-logic Dataset (见 sync-logic-nonoke.yml)
#   (生产侧另 token 独立命名空间, 双 token 爆炸半径各半; 详见 DECISIONS "HF_TOKEN 命名空间隔离" 条)
# 触发: 仅 Space 骨架四件变更才跑 (低频, 防高频 Rebuild 触 HF 7/16+ build 冻/风控)。

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'bootstrap.sh'
      - 'README.md'          # 根 README 须保留 HF frontmatter (sdk: docker, app_port: 7860)
      - '.gitattributes'
      - '.github/workflows/sync-space-nonoke.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Stage skeleton whitelist (4 files)
        run: |
          mkdir -p /tmp/hf-sync
          # 白名单: 仅 HF Space 骨架四件, 零业务件泄漏 (三层解耦后业务件不进 Space git 仓)
          for f in Dockerfile bootstrap.sh README.md .gitattributes; do
            cp "$f" /tmp/hf-sync/
          done
          echo "---- files to sync to nonoke/omn ----"
          ls -la /tmp/hf-sync

      - name: Push to HF Space (dev = nonoke/omn)
        env:
          T: ${{ secrets.HF_TOKEN_NONOKE }}
        run: |
          cd /tmp/hf-sync
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          # commit 带 n-omn 源 SHA: Space 侧每次构建可一眼对回 n-omn 血统
          git commit -qm "sync: n-omn@${GITHUB_SHA::7}" || echo "No changes to commit"
          git branch -M main
          git remote add hf "https://oauth2:${T}@huggingface.co/spaces/nonoke/omn"
          git push --force hf main
