name: Sync Space skeleton to dev Space

# 三层解耦 · 骨架同步 (高风险: push Space 触 HF 自动 Rebuild)
#
# 新拓扑 (2026-07-25 撤销 omn-v2 第三个 Space, 见 DECISIONS):
#   HF 免费层 2026-07 关闭新建 Docker Space 通道, 现役两 Space (nonoke/omn dev +
#   nomke/omn 旧生产 v4.2.3) 是祖父条款保护稀缺资产, 全程不再新建任何 Space。
#   现不蓝绿净室首跑: nonoke/omn 已跑三层真机验 (C2/九段/②), ②六绿即"已验证现役
#   架构", 晋级生产仅变量切换 + Restart, 零 Rebuild 零净室首跑。
#
# 当前阶段单投: 仅同步 dev Space (nonoke/omn) 骨架四件。
#   ─ matrix 结构保留: 未来若恢复双投 (如 nomke/omn 原地三层升级转 dev 后单投反切),
#     只 matrix.include 加一行, 不重写 job。
#   ─ 首投前 BASE_IMAGE Variable 由圣上手动钉锚 digest 9c9aecf (见 DECISIONS),
#     跨过整个"浮动 tag Rebuild 错误基座"风险类; T6 base-image.yml 建后此锚自动化。
#
# Token 命名空间隔离 (爆炸半径各半):
#   HF_TOKEN_NONOKE  — 写 nonoke/omn (dev) + nonoke/omn-logic Dataset (见 sync-logic-dev.yml)
#   HF_TOKEN_NOMKE   — 已建 (2026-07-26 圣上手 GitHub repo secret 加建, 生产 nomke/omn 专 token;
#                     原 GitHub repo secret HF_TOKEN 同批删除, 仓内无 env 名引用改名涉 — 仅 GitHub
#                     repo Secret 命名规范化对齐 NONOKE/NOMKE 体系). 本 Space sync job 现仍单投 dev
#                     (matrix.include 仅 nonoke/omn), 待 Phase 2 切流链至"生产 nomke 骨架 sync 启"节点
#                     再 matrix.include 解除 nomke/omn 留位注释, 不本批启.
# 触发: 仅 Space 骨架四件变更才跑 (低频, 防高频 Rebuild 触 HF 7/16+ build 冻/风控)。

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'bootstrap.sh'
      - 'README.md'          # 根 README 须保留 HF frontmatter (sdk: docker, app_port: 7860)
      - '.gitattributes'
      - '.github/workflows/sync-space-skeleton.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false       # 保留隔离语义, 单投亦不取消 (未来扩双投时即用)
      matrix:
        include:
          - { space: 'nonoke/omn',   token_key: 'HF_TOKEN_NONOKE' }   # dev (现阶段单投)
          # - { space: 'nomke/omn',    token_key: 'HF_TOKEN_NOMKE' }   # 生产 v4.2.3 (HF_TOKEN_NOMKE 已建 7-26);
                                                                       # 留位待 Phase 2 切流链至"生产 nomke 骨架 sync 启"
                                                                       # 节点解除注释; omn-v2 第三 Space 已撤销勿复名 (§1)
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Stage skeleton whitelist (4 files)
        run: |
          mkdir -p /tmp/hf-sync
          # 白名单: 仅 HF Space 骨架四件, 零业务件泄漏 (三层解耦后业务件不进 Space git 仓)
          for f in Dockerfile bootstrap.sh README.md .gitattributes; do
            cp "$f" /tmp/hf-sync/
          done
          echo "---- files to sync to ${{ matrix.space }} ----"
          ls -la /tmp/hf-sync

      - name: Push to HF Space
        env:
          T: ${{ secrets[matrix.token_key] }}
        run: |
          cd /tmp/hf-sync
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          # commit 带 n-omn 源 SHA: Space 侧每次构建可一眼对回 n-omn 血统
          git commit -qm "sync: n-omn@${GITHUB_SHA::7}" || echo "No changes to commit"
          git branch -M main
          git remote add hf "https://oauth2:${T}@huggingface.co/spaces/${{ matrix.space }}"
          git push --force hf main
