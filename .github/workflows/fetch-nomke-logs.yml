# Fetch HF Space logs → n-omn evidence 分支 (PROD 版: nomke/omn)
# 血统: 2026-07-26 切流链产物, 克隆自 dev 版 fetch 日志件 (件名见 DECISIONS "workflow 六件命名规约" 条)。
# 定位: 生产侧 CI 证据采集 — 切流验收三硬标取证通道 + 运行期 litestream 健康 cron 帧。
# 与 dev 版差异 (机制全继承, 仅五处):
#   1. SPACE=nomke/omn, token=HF_TOKEN_NOMKE (命名空间隔离, 爆炸半径各半)
#   2. DEST_DIR=logs/nomke--omn (与 dev 版 logs 卷平铺分卷, 病历不混)
#   3. cron 错峰 07/37 分 (dev 整/半点; 防 HF logs 端点并发互挤)
#   4. concurrency group 独立 (fetch-logs-prod, 双侧互不阻塞)
#   5. 新增"健康指纹摘要"步 (prod 专属)
# prod 告警语义: dev 侧 "compaction failed" 白名单不随行 — prod 桶内任何
#   AccessDenied / compaction failed / restore 失败指纹 = 停链级告警
#   (2026-07-26 nomke 403 断供事故入册: 桶名随 logic 平铺误入生产)。

name: Fetch HF Space logs → evidence (prod nomke)

on:
  schedule:
    # 与 dev 版 (整/半点) 错峰: 每小时 07/37 分
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      log_type:
        description: 抓哪类日志 (run=运行时, build=重建, both=双投)
        type: choice
        options: [run, build, both]
        default: run

permissions:
  contents: write

concurrency:
  group: fetch-logs-prod
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout — 补丁三同源, 必在 fetch 步前 (防 clean:true 删产出)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 抓取 HF Space 日志 (prod = nomke/omn)
        id: fetch
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_NOMKE }}
        run: |
          set -euo pipefail
          LOG_TYPE="${{ inputs.log_type || 'run' }}"
          TS=$(date -u '+%Y%m%d-%H%M')
          SPACE="nomke/omn"
          mkdir -p out
          fetch_one() {
            local kind="$1"
            echo "=== fetch $SPACE logs/$kind @ $TS ==="
            # rc 分账 (与 dev 版同规): rc=28=60s 兜底正常, 非 0/非 28=真失败;
            # 字节落盘即证据, 不因兜底 timeout 丢全量积压。
            curl -sS -N --max-time 60 \
              -H "Authorization: Bearer ${HF_TOKEN}" \
              "https://huggingface.co/api/spaces/${SPACE}/logs/${kind}" \
              -o "out/${kind}.log" && rc=0 || rc=$?
            local _bytes=0
            [ -f "out/${kind}.log" ] && _bytes=$(wc -c < "out/${kind}.log" || echo 0)
            echo "fetch_one $kind: rc=$rc bytes=${_bytes}"
            case "$rc" in
              0|28) [ "$_bytes" -gt 0 ] && return 0 || { echo "WARN: $kind 空窗 (0 字节, Space 闲或未启动)"; return 0; } ;;
              *)    echo "WARN: $kind 真失败 (rc=$rc 非 0/28), 已落盘 ${_bytes}B 保留作部分证据"; return 1 ;;
            esac
          }
          case "$LOG_TYPE" in
            run)   fetch_one run ;;
            build) fetch_one build ;;
            both)  fetch_one run; fetch_one build ;;
          esac
          echo "ts=$TS" >> "$GITHUB_OUTPUT"
          echo "log_type=$LOG_TYPE" >> "$GITHUB_OUTPUT"
          ls -la out/
          {
            echo "## fetch $SPACE @ $TS (PROD)"
            echo ""
            echo "| kind | bytes |"
            echo "|------|-------|"
            for f in out/*.log; do
              [ -f "$f" ] || continue
              k=$(basename "$f" .log)
              b=$(wc -c < "$f" || echo 0)
              echo "| $k | $b |"
            done
            echo ""
            echo "快照语义: 积压+实时窗 (单次抓取即全量 boot 历史), rc=28=60s 兜底正常非失败"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 健康指纹摘要 — prod 专属, 每帧自报 litestream 状态, 非阻塞纯证据
        id: health
        run: |
          set -uo pipefail
          {
            echo "### litestream 健康指纹 (prod 无白名单, 任何命中=告警)"
            echo ""
            for f in out/*.log; do
              [ -f "$f" ] || continue
              k=$(basename "$f" .log)
              bucket=$(grep -oE 'replicating to.*bucket=[^ ]*' "$f" | head -1 || true)
              snap=$(grep -c 'snapshot complete' "$f" || true)
              denied=$(grep -c 'AccessDenied' "$f" || true)
              compfail=$(grep -c 'compaction failed' "$f" || true)
              restfail=$(grep -c 'restore 失败' "$f" || true)
              echo "- \`$k\`: bucket=\`${bucket:-无}\` | snapshot ×$snap | AccessDenied ×$denied | compaction failed ×$compfail | restore 失败 ×$restfail"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "健康指纹已入 Summary (判定由人/下游消费, 本步不 fail)"

      - name: 脱敏闸 (与 dev 版同规, fail-closed — 宁丢一帧日志, 不泄一凭据)
        id: desens
        run: |
          set -euo pipefail
          HIT=0
          for f in out/*.log; do
            [ -f "$f" ] || continue
            if grep -nE 'nvapi-[A-Za-z0-9_\-]{20,}' "$f"; then
              echo "::error file=$f::命中 nvapi- NIM key 明文, 整 job fail-closed"; HIT=1
            fi
            if grep -nE '(Bearer|X-Internal-PSK)[^A-Za-z0-9]{1,3}[A-Za-z0-9_\-]{16,}' "$f"; then
              echo "::error file=$f::命中 Bearer/PSK 明文态, 整 job fail-closed"; HIT=1
            fi
            if grep -niE 'hf_[A-Za-z0-9]{20,}' "$f"; then
              echo "::error file=$f::命中 hf_ token 明文, 整 job fail-closed"; HIT=1
            fi
            if grep -qiE 'omniroute-data.*[Aa]ccess[A-Za-z0-9_-]{8,}' "$f"; then
              echo "::error file=$f::命中 R2 access key 明文, 整 job fail-closed"; HIT=1
            fi
            if grep -nE 'GATE_ADMIN_TOKEN[^A-Za-z0-9]{1,3}[A-Za-z0-9_\-]{16,}' "$f"; then
              echo "::error file=$f::命中 GATE_ADMIN_TOKEN 实值 (历史泄露), 整 job fail-closed"; HIT=1
            fi
          done
          if [ "$HIT" = "1" ]; then
            echo "::error::脱敏闸拦: 命中真值凭据形态, 不 commit 不 push"
            exit 1
          fi
          echo "脱敏闸已执行 PASS"
          echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: 落 evidence 分支 (logs/nomke--omn 卷, 与 dev 平铺)
        if: steps.desens.outputs.passed == 'true'
        run: |
          set -euo pipefail
          TS="${{ steps.fetch.outputs.ts }}"
          LOG_TYPE="${{ steps.fetch.outputs.log_type }}"
          BRANCH="evidence"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin
          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            git checkout "$BRANCH"
            git pull --rebase origin "$BRANCH" 2>/dev/null || true
          else
            git checkout --orphan "$BRANCH"
            git rm -rf . 2>/dev/null || true
          fi
          DEST_DIR="logs/nomke--omn"
          mkdir -p "$DEST_DIR"
          for f in out/*.log; do
            [ -f "$f" ] || continue
            kind=$(basename "$f" .log)
            cp "$f" "${DEST_DIR}/${TS}-${kind}.log"
          done
          # 保留期: 删 7 天前快照 (工作树不膨胀, git 历史留痕)
          find "$DEST_DIR" -name '*.log' -mtime +7 -delete || true
          git add -A "${DEST_DIR}/"
          if git diff --cached --quiet; then
            echo "无新快照, skip commit"
          else
            git commit \
              -m "chore(evidence): HF prod $LOG_TYPE logs ${TS} [skip ci]" \
              -m "Space: nomke/omn | 快照语义: 积压+实时窗, rc=28 兜底正常" \
              -m "prod 无白名单: AccessDenied/compaction failed/restore 失败 = 停链级告警"
            git push origin "$BRANCH"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 首跑验证回显
        if: always()
        run: |
          echo "=== 验收三点回显 (prod) ==="
          echo "1. evidence 分枝 logs/nomke--omn/ 出现快照"
          echo "2. 脱敏闸: steps.desens.outputs.passed = '${{ steps.desens.outputs.passed }}'"
          echo "3. 健康指纹: 见 Summary (bucket 行 / snapshot / AccessDenied 计数)"
          git --no-pager log --oneline -3 2>/dev/null || true
