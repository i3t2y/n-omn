name: deploy-ho-proxy-pages

# Page 版反代 (sonoke → xnexus gate) 部署 · tag-driven (仿 deploy-ho-proxy.yml worker 版)
# 拓扑: sonoke → proxy.360710.xyz (CF Pages 边缘, 前置 PSK 校验 + 注入 HF_TOKEN) → xnexus-o.hf.space
# 触发: push `deploy-pages-*` tag 或 workflow_dispatch 手动
#
# GH Secrets (Zen填值, 值不进 repo/git, workflow 只引用):
#   CF_API_TOKEN (账号 B) → B_CF_TOKEN   — scope 仅 need: Pages Edit
#   INTERNAL_PSK (gate.js 同源常量值)     → 边缘前置鉴权 + 出站透传
#   HF_TOKEN (xnexus-o 账号 HF 平台门票)  → 出站注入 X-Api-Key (私有 Space)
# Secret (Zen已配在 Secrets 而非 Variables, workflow 据此读 secrets.):
#   B_CF_ACCOUNT_ID (账号 B 的 account id)
#
# 机制: GH Actions 作部署流水线, 从 GH secret 读音, printf|wrangler pages secret put 注入 CF,
#      再 pages deploy 推函数. 值全程不经会话/repo 明文 (秘密只在 GH 加密库 + CF 运行时).

on:
  push:
    tags:
      - "deploy-pages-*"
  workflow_dispatch:
    inputs:
      command:
        description: "wrangler pages command (deploy)"
        required: false
        default: "deploy"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.B_CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: 校验 GH secrets 已配置 (空值即 fail, 防空 secret 注入 CF)
        run: |
          : "${INTERNAL_PSK:?INTERNAL_PSK secret 未配置}"
          : "${HF_TOKEN:?HF_TOKEN secret 未配置}"
        env:
          INTERNAL_PSK: ${{ secrets.INTERNAL_PSK }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: 确保 Pages 项目存在 (wrangler ≥4 不自动建项目, 已存在则幂等忽略)
        run: |
          npx wrangler@latest pages project create ho-proxy-pages --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.B_CF_TOKEN }}

      - name: 注入 INTERNAL_PSK secret (边缘前置鉴权 + 出站透传导密钥)  [须在 deploy 前]
        run: |
          printf '%s' "${{ secrets.INTERNAL_PSK }}" \
            | npx wrangler@latest pages secret put INTERNAL_PSK --project-name ho-proxy-pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.B_CF_TOKEN }}

      - name: 注入 HF_TOKEN secret (私有 Space 门票 → X-Api-Key)  [须在 deploy 前]
        run: |
          printf '%s' "${{ secrets.HF_TOKEN }}" \
            | npx wrangler@latest pages secret put HF_TOKEN --project-name ho-proxy-pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.B_CF_TOKEN }}

      - name: Deploy ho-proxy Pages (建/更新项目 + 推 functions, secret 已注入可读)
        run: |
          # 必须 cd 进部署目录跑 `.` : 相对子路径 (deploy scripts/pages) wrangler 4.x 不发现
          # functions/ → "No Functions" 部署空站 404 (本地三态实证: 子路径❌ / cd+`.`✅ / toml 无关)
          # 必须 --branch main : GH Actions checkout 是 detached HEAD(tag), 不指定 branch 会被判 preview 部署,
          #   secret 绑 production env → preview 读不到 INTERNAL_PSK → 503 (默认 URL 也一直 404 = 无 production).
          #   --branch main 强制 production, 吃到 production secret + 挂上 ho-proxy-pages.pages.dev 默认 URL.
          cd scripts/pages && npx wrangler@latest pages deploy . --project-name ho-proxy-pages --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.B_CF_TOKEN }}